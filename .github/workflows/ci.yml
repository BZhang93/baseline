name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Installs deps and runs `prisma generate` via the postinstall script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Placeholder env so the production build doesn't fail on missing vars.
      # Real values are configured in Vercel, not here.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:6543/postgres?pgbouncer=true
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/postgres

  # Browser tests for the signed-out flows. Runs the Playwright `public` project
  # only — it needs no account/secrets, and boots the dev server with placeholder
  # env (these specs test signed-out behaviour, so auth never has to succeed).
  # Authed specs (*.authed.spec.ts) are intentionally not run here; they need a
  # test-account secret + a reachable backend — add as a follow-up job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (public specs)
        run: pnpm test:e2e --project=public
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:6543/postgres?pgbouncer=true
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/postgres

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
